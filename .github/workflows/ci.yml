name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: cachix/install-nix-action@v31

    - name: Cache Nix store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', '**/*.cabal') }}-${{ github.sha }}
        restore-prefixes-first-match: |
          nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', '**/*.cabal') }}-

    - name: Build and unit tests
      run: nix build --print-build-logs

    - name: Integration tests
      run: nix develop .#ci --command env APP_BINARY="$PWD/result/bin/career-trainer" bash ./test/integration/answer-question.sh
